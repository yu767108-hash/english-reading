<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#F4FAF4;--ink:#1F3B32;--soft:#3F5A4B;--muted:#5F7769;--line:#D5E6D9;--amber:#356B52;--mint:#2F6B50;--red:#AD543F;
--ui:'Archivo',system-ui,sans-serif;--serif:'Newsreader',Georgia,serif;--mono:'IBM Plex Mono',monospace}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mast{max-width:960px;margin:0 auto;padding:24px 28px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font:500 9px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--ink);border-bottom:1px solid #B9D3C1;transition:border-color .18s}
.back:hover{border-color:var(--amber)}
main{max-width:960px;margin:0 auto;padding:38px 28px 60px}
.kicker{font:600 9px/1 var(--mono);letter-spacing:.2em;color:var(--mint);text-transform:uppercase}
h1{font:400 48px/1.05 var(--serif);letter-spacing:-.02em;margin:14px 0 0;color:var(--ink)}
.lede{font:400 13px/1.7 var(--ui);color:var(--muted);margin:12px 0 0}
.list{margin-top:26px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:68px 1fr 40px;gap:18px;align-items:center;padding:14px 18px;border-radius:22px;text-decoration:none;color:inherit;transition:background .18s,transform .18s}
.row:hover{background:#EAF7EE;transform:translateY(-1px)}
.date{width:64px;height:64px;border-radius:50%;background:#E3F1E7;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.date b{font:600 24px/1 var(--ui);letter-spacing:-.03em;color:var(--ink)}
.date span{font:600 7px/1.3 var(--mono);letter-spacing:.1em;color:var(--muted);text-align:center;margin-top:2px}
.body{min-width:0}
.cat{display:block;margin-bottom:5px;font:600 8px/1 var(--mono);letter-spacing:.16em;color:var(--amber)}
.ttl{display:block;font:400 21px/1.25 var(--serif);letter-spacing:-.01em;color:var(--ink)}
.arrow{width:36px;height:36px;border-radius:50%;background:#EAF5EC;color:var(--amber);display:flex;align-items:center;justify-content:center;font:400 16px/1 var(--ui);transition:background .18s,color .18s,transform .18s}
.row:hover .arrow{background:var(--amber);color:#fff;transform:translateX(2px)}
.foot{max-width:960px;margin:0 auto;padding:20px 28px 34px;font:500 8px/1.5 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){
  .mast{padding:16px 18px 0;font-size:8px;letter-spacing:.1em}
  main{padding:28px 18px 46px}
  h1{font-size:36px}
  .row{grid-template-columns:54px 1fr 32px;gap:12px;padding:12px 10px;border-radius:18px}
  .date{width:50px;height:50px}
  .date b{font-size:20px}
  .date span{font-size:6px}
  .ttl{font-size:18px}
  .arrow{width:32px;height:32px}
  .foot{padding:16px 18px 28px;font-size:7px}
}
</style></head><body>
